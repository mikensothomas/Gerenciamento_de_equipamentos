<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f6f5">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro Equipamento</title>
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">EquipaGO</a>

        <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu"
            type="button">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="menu" id="menu">
            <a href="../../login/index.html">Login</a>
            <a href="../../cadastro/usuario/index.html">Cadastro Usuário</a>
            <a href="../../cadastro/equipamento/index.html" class="active">
                Cadastro Equipamento
            </a>
            <a href="../../solicitacoes/index.html">Solicitações</a>
            <a href="../../buscar/index.html">Dashboard</a>
        </nav>
    </header>

    <main>
        <section>
            <h1>Cadastro de Equipamento</h1>
            <h3>EquipaGO</h3>
        </section>
        <form action="">
            <label for="nome">Nome do equipamento</label>
            <input id="nome" name="nome" type="text" placeholder="Digite o nome do equipamento" required>
            <label for="patrimonio">Patrimonio</label>
            <input id="patrimonio" name="patrimonio" type="text" placeholder="Patrimonio do equipamento" required>
            <label for="marca">Marca</label>
            <input id="marca" name="marca" type="marca" placeholder="Digite a marca do equipamento" required>
            <label for="modelo">Modelo</label>
            <input id="modelo" name="modelo" type="text" placeholder="Digite o modelo do equipamento" required>
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" placeholder="Descreva o equipamento" required></textarea>
            <button type="button">Cadastrar</button>
        </form>
    </main>
    <script src="../../js/menu.js"></script>
</body>
</html>
