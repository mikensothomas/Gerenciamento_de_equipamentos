
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Perfil</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="cabecalho">
                <h1>Cadastro de Perfil</h1>
                <p>Cadastre um novo perfil no sistema</p>
            </div>

            <form id="form-perfil">

                <div class="campo">
                    <label for="nome">Nome do perfil</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Ex: Administrador"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <textarea
                        id="descricao"
                        placeholder="Descreva a finalidade deste perfil"
                        maxlength="255"
                        required
                    ></textarea>
                </div>

                <div class="campo">
                    <label for="status">Status</label>
                    <select id="status" required>
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                </div>

                <div class="botoes">
                    <button type="submit" class="btn-cadastrar" id="btn-cadastro">
                        Cadastrar perfil
                    </button>

                    <button type="reset" class="btn-limpar">
                        Limpar
                    </button>
                </div>

            </form>

        </section>
        <script src="index.js"></script>

    </main>

</body>
</html>
