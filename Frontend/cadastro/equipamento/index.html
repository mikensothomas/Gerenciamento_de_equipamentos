<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f6f5">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="../../Assets/logotipo.png">
    <title>Cadastro Equipamento</title>
</head>

<body>

    <header class="navbar">
        <a href="../../inicio/index.html" class="logo">EquipaGO</a>

        <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu"
            type="button">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="menu" id="menu">
            <a href="../../login/index.html">Login</a>
            <a href="../../cadastro/usuario/index.html">Cadastro Usuário</a>
            <a href="../../cadastro/equipamento/index.html" class="active">
                Cadastro Equipamento
            </a>
            <a href="../../solicitacoes/index.html">Solicitações</a>
            <a href="../../buscar/index.html">Dashboard</a>
        </nav>
    </header>

    <main>
        <section>
            <h1>Cadastro de Equipamento</h1>
            <h3>EquipaGO</h3>
        </section>
        <form action="" class="form-container">
            <div class="form-grid">
                <div class="form-column">
                    <div class="input-group">
                        <label for="nome">Nome do equipamento</label>
                        <input id="nome" name="nome" type="text" placeholder="Digite o nome do equipamento" required>
                    </div>

                    <div class="input-group">
                        <label for="patrimonio">Patrimônio</label>
                        <input id="patrimonio" name="patrimonio" type="text" placeholder="Patrimônio do equipamento"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="marca">Marca</label>
                        <input id="marca" name="marca" type="text" placeholder="Digite a marca do equipamento" required>
                    </div>

                    <div class="input-group">
                        <label for="modelo">Modelo</label>
                        <input id="modelo" name="modelo" type="text" placeholder="Digite o modelo do equipamento"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="descricao">Descrição</label>
                        <textarea id="descricao" name="descricao" placeholder="Descreva o equipamento" rows="4"
                            required></textarea>
                    </div>
                </div>

                <div class="form-column">
                    <div class="input-group">
                        <label for="status">Status</label>
                        <input id="status" name="status" type="text" placeholder="O status do equipamento">
                    </div>

                    <div class="input-group">
                        <label for="categoria">Categoria</label>
                        <input id="categoria" name="categoria" type="text" placeholder="Digite a categoria" required>
                    </div>

                    <div class="input-group">
                        <label for="quantidade">Quantidade</label>
                        <input id="quantidade" name="quantidade" type="number" placeholder="Digite a quantidade"
                            required min="1" oninput="if(this.value < 1 && this.value !== '') this.value = 1;">
                    </div>

                    <div class="input-group">
                        <label for="imagem">Imagem</label>
                        <input id="imagem" name="imagem" type="file" accept="image/*" required>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Cadastrar</button>
            </div>
        </form>
    </main>
    <script src="../../js/menu.js"></script>
</body>

</html>
