<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f6f5">
    <link rel="stylesheet" href="index.css">
    <title>Cadastro</title>
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">EquipaGO</a>

        <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu"
            type="button">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="menu" id="menu">
            <a href="../../login/index.html">Login</a>
            <a href="../../cadastro/usuario/index.html" class="active">Cadastro Usuário</a>
            <a href="../../cadastro/equipamento/index.html">
                Cadastro Equipamento
            </a>
            <a href="../../solicitacoes/index.html">Solicitações</a>
            <a href="../../buscar/index.html">Dashboard</a>
        </nav>
    </header>
    <main>
        <section>
            <h1>Fazer seu cadastro</h1>
            <h3>EquipaGO</h3>
        </section>
        <form action="">
            <label for="cpf">CPF</label>
            <input id="cpf" name="cpf" type="text" placeholder="Digite seu CPF" required>
            <label for="nome">Nome completo</label>
            <input id="nome" name="nome" type="text" placeholder="Escreva seu nome completo" required>
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="Escreva seu e-mail" autocomplete="email" required>
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" placeholder="Digite sua senha"
                autocomplete="current-password" required>
            <label for="confirmar-senha">Confirmar senha</label>
            <input id="confirmar-senha" name="confirmar-senha" type="password" placeholder="Confirme sua senha"
                autocomplete="current-password" required>
            <button type="button">Cadastrar</button>
        </form>
        <footer>
            <p>Esqueceu sua senha?</p>
            <a href="#">Fale com o administrador</a>
        </footer>
    </main>
    <script src="../../js/menu.js"></script>
</body>

</html>
