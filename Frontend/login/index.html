<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f6f5">
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/png" href="../Assets/logotipo.png">
    <title>Login</title>
</head>

<body>
    <header class="navbar">
        <a href="../inicio/index.html" class="logo">EquipaGO</a>

        <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu"
            type="button">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="menu" id="menu">
            <a href="../login/index.html" class="active">Login</a>
            <a href="../cadastro/usuario/index.html">Cadastro Usuário</a>

            </a>
            <a href="../solicitacoes/index.html">Solicitações</a>
            <a href="../buscar/index.html">Dashboard</a>
        </nav>
    </header>
    <main>
        <section>
            <h1>Acesse sua conta</h1>
            <h3>SquipaGO</h3>
        </section>
        <form action="">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="Escreva seu e-mail" autocomplete="email" required>
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            <button type="button">Entrar</button>
        </form>
        <footer>
            <p>Esqueceu sua senha?</p>
            <a href="#">Fale com o administrador</a>
        </footer>
    </main>
    <script src="../js/menu.js"></script>
</body>
